<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 THE ULTIMATE INTERACTIVE CHAOS ZONE 🌀</title>
    <style>
        /* --- CORE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Impact', sans-serif;
            user-select: none;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            perspective: 1000px;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 9999;
            border-bottom: 5px dashed #ff00ff;
        }

        .nav-btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #000;
            border: 3px solid #00ffff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #ff00ff;
            color: #000;
            transform: scale(1.1) rotate(-3deg);
            box-shadow: 0 0 20px #ff00ff;
        }

        .nav-btn.active {
            background: #00ff00;
            color: #000;
            border-color: #fff;
            animation: jitter 0.3s infinite alternate;
        }

        @keyframes jitter {
            0% { transform: translateY(-2px) rotate(1deg); }
            100% { transform: translateY(2px) rotate(-1deg); }
        }

        /* --- MULTI-PAGE CONTAINER --- */
        .page-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .page.active {
            display: flex;
            animation: pageEnter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pageEnter {
            0% { transform: scale(0) rotate(720deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* --- VISUAL ELEMENTS & ANIMATIONS --- */
        h1 {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff00ff;
            margin-bottom: 20px;
            animation: textWobble 2s infinite ease-in-out alternate;
        }

        @keyframes textWobble {
            0% { transform: scale(1) skewX(-5deg); filter: hue-rotate(0deg); }
            100% { transform: scale(1.1) skewX(5deg); filter: hue-rotate(360deg); }
        }

        .dynamic-btn {
            padding: 20px 40px;
            font-size: 2rem;
            background: yellow;
            color: red;
            border: 5px solid black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 10px 10px 0px #00ffff;
            transition: 0.1s;
        }

        .dynamic-btn:active {
            box-shadow: 2px 2px 0px #00ffff;
            transform: translate(8px, 8px);
        }

        /* --- JS SPARKLE PARTICLES --- */
        .sparkle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: flyAway 1s linear forwards;
            z-index: 999;
        }

        @keyframes flyAway {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }

        /* --- JUMPING BOXES --- */
        .box-zoo {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .creature {
            width: 100px;
            height: 100px;
            background: chartreuse;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-btn active" onclick="switchPage('home')">🏠 Chaos Hub</div>
        <div class="nav-btn" onclick="switchPage('sparkle-zone')">✨ Sparkle Zone</div>
        <div class="nav-btn" onclick="switchPage('box-zoo')">👾 Creature Zoo</div>
        <div class="nav-btn" onclick="switchPage('glitch-world')">⚡ Mutation Terminal</div>
    </nav>

    <div class="page-container">

        <section class="page active" id="home">
            <h1>THE DYNAMIC MATRIX</h1>
            <button class="dynamic-btn" onclick="triggerExplosion(event)">CLICK FOR EXPLOSION!</button>
        </section>

        <section class="page" id="sparkle-zone">
            <h1>SPARKLE PARADISE</h1>
            <p style="color: cyan; font-size: 2rem; background: #000; padding: 10px;">Move your mouse fast across the screen!</p>
        </section>

        <section class="page" id="box-zoo">
            <h1>THE RUNAWAY BOXES</h1>
            <p style="color: magenta; font-size: 1.5rem;">Try to hover over these creatures if you can!</p>
            <div class="box-zoo">
                <div class="creature" onmouseover="runAway(this)">🤪</div>
                <div class="creature" onmouseover="runAway(this)">😎</div>
                <div class="creature" onmouseover="runAway(this)">👻</div>
            </div>
        </section>

        <section class="page" id="glitch-world">
            <h1>MUTATION ZONE</h1>
            <button class="dynamic-btn" style="background: fuchsia; color: white;" onclick="mutateBackground()">MUTATE SCREEN COLOR</button>
        </section>

    </div>

    <script>
        // 1. DYNAMIC PAGE ROUTER
        function switchPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            // Remove active status from all buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show target page
            document.getElementById(pageId).classList.add('active');
            // Highlight current button
            event.target.classList.add('active');
            
            // Fire off a massive color burst celebration
            celebratePageChange();
        }

        // 2. MOUSE TRAIL ENGINE (Works everywhere, heavily intense on Sparkle Zone)
        window.addEventListener('mousemove', (e) => {
            // Only spawn trails randomly or if on the sparkle page to keep performance fast
            if (Math.random() > 0.15 && document.getElementById('sparkle-zone').classList.contains('active') === false) return;

            createParticle(e.clientX, e.clientY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('sparkle');
            document.body.appendChild(particle);

            // Give it a crazy randomized size and vibrant neon colors
            const size = Math.random() * 30 + 10;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            const colors = ['#ff0055', '#00ffcc', '#ffff00', '#ff00ff', '#00ff00', '#ff7700'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // Position the particle perfectly under the pointer
            particle.style.left = `${x - size/2}px`;
            particle.style.top = `${y - size/2}px`;

            // Calculate a completely random explosive path trajectory
            const destinationX = (Math.random() - 0.5) * 200;
            const destinationY = (Math.random() - 0.5) * 200;
            particle.style.setProperty('--mx', `${destinationX}px`);
            particle.style.setProperty('--my', `${destinationY}px`);

            // Destroy the element out of DOM after animation finishes
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }

        // 3. EXPLOSION BUTTON TRIGGER
        function triggerExplosion(e) {
            for (let i = 0; i < 40; i++) {
                createParticle(e.clientX, e.clientY);
            }
        }

        // 4. CELEBRATION EFFECT (Spawns sparks everywhere)
        function celebratePageChange() {
            for(let i = 0; i < 30; i++) {
                let randomX = Math.random() * window.innerWidth;
                let randomY = Math.random() * window.innerHeight;
                createParticle(randomX, randomY);
            }
        }

        // 5. THE RUNAWAY INTERACTION (Teleports blocks away when you try to mouseover)
        function runAway(element) {
            const randomX = Math.random() * (window.innerWidth - 150);
            const randomY = Math.random() * (window.innerHeight - 150);
            
            element.style.position = 'absolute';
            element.style.left = `${randomX}px`;
            element.style.top = `${randomY}px`;
            
            // Randomly spin them when they run away
            element.style.transform = `rotate(${Math.random() * 360}deg) scale(1.3)`;
        }

        // 6. SCREEN MUTATOR
        function mutateBackground() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }
    </script>
</body>
</html>
